<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Chef WS with cooking questions and recipe requests.">
  <title>Contact | Chef WS</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="index.html" aria-label="Chef WS home"><img src="image/logo1.png" alt="Chef WS logo"></a></div>
    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="recipes.html">Recipe</a><a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <details><summary>Menu</summary><div class="mobile-links"><a href="index.html">Home</a><a href="recipes.html">Recipe</a><a href="contact.html" aria-current="page">Contact</a></div></details>
    </nav>
  </header>
  <main class="content">
    <div class="photo-row">
      <img src="image/wayancook.png" alt="Chef preparing food">
      <img src="image/sushi.png" alt="Sushi presentation">
    </div>
    <section class="contact-section" aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact Form</h1>
      <p class="intro">Have a cooking question or recipe request? Send Chef WS a message.</p>
      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="39473ffa-040b-46e3-a835-709257a3f037">
        <label for="fname">First Name</label>
        <input id="fname" name="firstname" type="text" autocomplete="given-name" placeholder="Your first name" required maxlength="100">
        <label for="lname">Last Name</label>
        <input id="lname" name="lastname" type="text" autocomplete="family-name" placeholder="Your last name" required maxlength="100">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Your email address" required maxlength="254">
        <label for="subject">Cooking Question or Recipe Request</label>
        <textarea id="subject" name="subject" placeholder="Write your question here" rows="7" required maxlength="5000"></textarea>
        <div class="form-actions"><button type="submit">Submit</button><button type="reset" class="secondary">Clear</button></div>
      </form>
    </section>
  </main>
  <footer><p>Copyright © 2026 CHEF_WAYAN_SUTRIASA</p></footer>
</body>
</html>
